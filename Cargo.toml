[package]
name = "rustcord"
version = "0.2.0"
edition = "2024"

[dependencies]
anyhow = "1.0.105"
async-channel = "2.5.0"
futures-util = "0.3.34"
gpui = "0.2"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "gzip", "brotli", "http2", "charset"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "sync", "time", "macros"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "rustls-tls-webpki-roots", "handshake"] }

[patch.crates-io]
xattr = { path = "vendor/xattr" }
